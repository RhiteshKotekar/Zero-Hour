# Graph-derived coordination cost (brief §5.4). Same rule for every topology.
# c(a, b) = 0 if a == b, h0 + h1 * hops if a permitted path exists, infeasible otherwise.
version: topo-cost-v1
h0: 1.0
h1: 0.5
link_cost: 0.25              # per undirected coordination link the topology maintains (proposed D019)
max_path_hops: 4             # longer paths count as "no permitted path"
handoff_delay_per_hop: 2.0   # simulated minutes added per hop before the dependent task may start
hop_failure_probability: 0.02
distributed_max_degree: 3
sensitivity:                 # predeclared low/base/high settings (brief §12.9)
  low:  {h0: 0.5, h1: 0.25}
  base: {h0: 1.0, h1: 0.5}
  high: {h0: 2.0, h1: 1.0}
